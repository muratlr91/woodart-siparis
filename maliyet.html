<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodart | Maliyet</title><style>
:root{--g:#173b2a;--w:#a66c3b;--paper:#f7f4ee;--ink:#24312a;--line:#dce4de;--muted:#68776f}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px Arial,sans-serif;color:var(--ink)}.app{max-width:1280px;margin:auto;padding:18px}.top,.head,.actions,.tabs{display:flex;gap:10px;align-items:center}.top,.head{justify-content:space-between}.top{margin-bottom:16px}.top h1,.head h2{margin:0}.top p,.muted{color:var(--muted);margin:5px 0;font-size:13px}.button,.tab{border:1px solid var(--line);background:#fff;color:var(--g);padding:10px 12px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.button.primary,.tab.active{background:var(--g);color:#fff;border-color:var(--g)}.tabs{margin-bottom:14px}.tab{border-radius:8px}.pane{display:none}.pane.active{display:block}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700;color:#526158}.field input,.field select,.search{width:100%;min-width:0;padding:10px;border:1px solid #cbd7cf;border-radius:8px;background:#fff;font:inherit}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdfb}.card small{color:var(--muted)}.card strong{display:block;color:var(--g);font-size:21px;margin-top:6px}.candle{border-left:5px solid #b57419;background:#fff9ed}.laser{border-left:5px solid #3979a5}.summary{background:#eef7f1;border:2px solid #c6dfcd}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:11px}.product{border:1px solid var(--line);border-radius:11px;padding:11px}.product-top{display:grid;grid-template-columns:48px 1fr;gap:9px;align-items:center;margin-bottom:9px}.product img{width:48px;height:42px;object-fit:cover;border-radius:6px;background:#eef2ed}.product h3{font-size:14px;margin:2px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.result div{background:#f3f8f4;border-radius:7px;padding:7px;font-size:11px}.result b{display:block;font-size:13px;margin-top:3px}.hide{display:none}.notice{min-height:18px;color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:700px){.app{padding:12px}.top,.head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .button{flex:1;padding:9px 5px;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.tab{padding:10px 4px;font-size:12px}.panel{padding:13px}.grid,.fields,.result,.products{grid-template-columns:1fr}.search{max-width:none!important}}
</style></head><body><main class="app"><div class="top"><div><h1>Maliyet hesabı</h1><p>Malzeme, mum ve ürün maliyetleri</p></div><div class="actions"><button class="button" id="load">Buluttan güncelle</button><button class="button primary" id="save">Buluta eşitle</button></div></div><nav class="tabs"><button class="tab active" data-tab="laser">Lazer kesim</button><button class="tab" data-tab="candle">Mum</button><button class="tab" data-tab="products">Ürün maliyetleri</button></nav><section class="pane active" data-pane="laser" id="laser"></section><section class="pane" data-pane="candle" id="candle"></section><section class="pane" data-pane="products"><div class="panel"><div class="head"><div><h2>Ürün maliyetleri</h2><p class="muted">Stok adı veya koduyla arayın.</p></div><div class="actions"><input class="search" id="search" placeholder="Ürün veya stok kodu ara..."><button class="button" id="sync">Stokları yenile</button></div></div><div class="products" id="products"></div><p class="muted hide" id="empty">Aramanızla eşleşen stok bulunamadı.</p></div></section><div class="notice" id="notice"></div></main><script>
(()=>{const K={data:'woodart-demo-data',exact:'woodart-kitap121-exact-v2',candle:'woodart-mum-maliyet-v1',laser:'woodart-lazer-malzemeler-v1'};const n=v=>Number(v)||0,m=v=>'₺ '+n(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});const get=(k,f)=>{try{return {...f,...JSON.parse(localStorage.getItem(k)||'{}')}}catch(e){return f}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),note=t=>document.querySelector('#notice').textContent=t||'';let exact=get(K.exact,{rates:{stone:.04,mdf:.55,candle:.35,retail:2.5,online:5},rows:{}});exact.rates={stone:.04,mdf:.55,candle:.35,retail:2.5,online:5,...(exact.rates||{})};exact.rows=exact.rows||{};let candle=get(K.candle,{purchasePrice:170,purchaseQuantity:1000,wickCost:5,jarCost:5,mouldWater:50,waxFactor:.9,retailMultiplier:2.5,onlineMultiplier:5});let laser=get(K.laser,{costFactor:1.7,saleFactor:1.15,materials:[{id:'mdf',name:'MDF',m2:155,minute:5,width:30,height:30,duration:20},{id:'plexi',name:'Plexi',m2:500,minute:10,width:30,height:30,duration:10}]});let timer;const cloud=()=>{clearTimeout(timer);timer=setTimeout(()=>window.parent?.woodartSaveAllCostData?.(),700)};const saveExact=()=>{put(K.exact,exact);cloud()},saveCandle=()=>{put(K.candle,candle);cloud()},saveLaser=()=>{put(K.laser,laser);cloud()};const stocks=()=>get(K.data,{stock:[]}).stock||[];const out=r=>{const group=r.group||'stone',amount=group==='mdf'?n(r.mdfAmount):n(r.multiplier)*n(r.mouldWater),water=group==='mdf'?0:amount*n(r.mixRatio),rate=group==='mdf'?n(exact.rates.mdf):group==='candle'?n(exact.rates.candle):n(exact.rates.stone),cost=amount*rate;return{amount,water,cost,min:cost*n(exact.rates.retail),online:cost*n(exact.rates.online)}};const sync=()=>{stocks().forEach(s=>{const o=exact.rows[s.code]||{},p=s.costFormula||s.costParams||{};exact.rows[s.code]={code:s.code,name:s.name,image:s.image||'stok-urunleri.png',group:o.group||p.group||'stone',multiplier:o.multiplier??p.multiplier??p.factor??1.46,mixRatio:o.mixRatio??p.mixRatio??p.ratio??.35,mouldWater:o.mouldWater??p.mouldWater??p.water??240,mdfAmount:o.mdfAmount??p.mdfAmount??p.quantity??0}});saveExact();products()};const product=r=>{const o=out(r);return `<article class="product" data-code="${r.code}"><div class="product-top"><img src="${r.image}" alt=""><div><small>${r.code}</small><h3>${r.name}</h3></div></div><div class="fields"><div class="field"><label>Maliyet grubu</label><select data-field="group"><option value="stone" ${r.group==='stone'?'selected':''}>Taş tozu</option><option value="mdf" ${r.group==='mdf'?'selected':''}>MDF</option><option value="candle" ${r.group==='candle'?'selected':''}>Mum</option></select></div>${[['multiplier','Su çarpanı'],['mixRatio','Karıştırma oranı'],['mouldWater','Kalıbın aldığı su'],['mdfAmount','Ürün miktarı']].map(([key,label])=>`<div class="field"><label>${label}</label><input data-field="${key}" type="number" step="0.01" value="${key==='mdfAmount'&&r.group!=='mdf'?o.amount:r[key]}" ${(key==='mdfAmount')===(r.group==='mdf')?'':'disabled'}></div>`).join('')}</div><div class="result"><div>Su miktarı<b>${o.water.toLocaleString('tr-TR',{maximumFractionDigits:2})}</b></div><div>Maliyet<b>${m(o.cost)}</b></div><div>Satış önerisi<b>${m(o.min)} / ${m(o.online)}</b></div></div></article>`};const products=()=>{const term=document.querySelector('#search')?.value.toLocaleLowerCase('tr-TR').trim()||'',rows=Object.values(exact.rows).filter(r=>!term||(r.code+' '+r.name).toLocaleLowerCase('tr-TR').includes(term));document.querySelector('#products').innerHTML=rows.map(product).join('');document.querySelector('#empty').classList.toggle('hide',rows.length>0)};const candleView=()=>{const gram=n(candle.purchasePrice)/n(candle.purchaseQuantity),usage=n(candle.mouldWater)*n(candle.waxFactor),cost=n(candle.wickCost)+n(candle.jarCost)+usage*gram;document.querySelector('#candle').innerHTML=`<div class="panel candle"><div class="head"><div><h2>Mum obje fiyatı</h2><p class="muted">Fitil + kap + (mum tüketimi × gram maliyeti)</p></div><strong>${m(cost)}</strong></div><div class="grid">${[['purchasePrice','Alınan fiyat (₺)'],['purchaseQuantity','Alınan miktar (gr)'],['wickCost','Fitil maliyeti (₺)'],['jarCost','Kap maliyeti (₺)'],['mouldWater','Kalıbın su dolu ağırlığı (gr)'],['waxFactor','Mum çarpanı']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-candle="${k}" type="number" step="0.01" value="${candle[k]}"></div>`).join('')}<div class="card"><small>Mum gram maliyeti</small><strong>${m(gram)}</strong></div><div class="card"><small>Mum tüketimi</small><strong>${usage.toLocaleString('tr-TR',{maximumFractionDigits:2})} gr</strong></div></div></div><div class="panel summary"><div class="grid"><div class="card"><small>Maliyet</small><strong>${m(cost)}</strong></div>${[['retailMultiplier','Minimum satış çarpanı'],['onlineMultiplier','İnternet satış çarpanı']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-candle="${k}" type="number" step="0.01" value="${candle[k]}"><strong>${m(cost*n(candle[k]))}</strong></div>`).join('')}</div></div>`};const lc=x=>(n(x.width)*n(x.height)/10000*n(x.m2)*n(laser.costFactor))+(n(x.duration)*n(x.minute));const laserView=()=>{const total=laser.materials.reduce((s,x)=>s+lc(x),0);document.querySelector('#laser').innerHTML=`<div class="panel laser"><div class="head"><div><h2>Lazer kesim</h2><p class="muted">Her malzeme toplam satış fiyatına eklenir.</p></div><button class="button" id="add">+ Malzeme ekle</button></div><div class="grid"><div class="field"><label>Maliyet çarpanı</label><input data-global="costFactor" type="number" step="0.01" value="${laser.costFactor}"></div><div class="field"><label>Satış çarpanı</label><input data-global="saleFactor" type="number" step="0.01" value="${laser.saleFactor}"></div></div></div>${laser.materials.map(x=>`<div class="panel laser" data-material="${x.id}"><div class="head"><div class="field"><label>Malzeme adı</label><input data-laser="name" value="${x.name}"></div><div><strong>${m(lc(x))}</strong> <button class="button" data-remove="${x.id}">Sil</button></div></div><div class="grid">${[['m2','m² fiyatı'],['minute','Kesim / dk'],['width','En (cm)'],['height','Boy (cm)'],['duration','Üretim süresi (dk)']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-laser="${k}" type="number" step="0.01" value="${x[k]}"></div>`).join('')}</div></div>`).join('')}<div class="panel summary"><small>Toplam maliyet</small><strong>${m(total)}</strong><small>Toplam satış fiyatı</small><strong>${m(total*n(laser.saleFactor))}</strong></div>`};document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector(`[data-pane="${t.dataset.tab}"]`).classList.add('active');return}if(e.target.closest('#sync')){sync();note('Stok listesi güncellendi.')}if(e.target.closest('#add')){laser.materials.push({id:'m'+Date.now(),name:'Yeni malzeme',m2:0,minute:0,width:0,height:0,duration:0});saveLaser();laserView()}const r=e.target.closest('[data-remove]');if(r){laser.materials=laser.materials.filter(x=>x.id!==r.dataset.remove);saveLaser();laserView()}});document.addEventListener('input',e=>{const c=e.target.closest('[data-candle]');if(c){candle[c.dataset.candle]=n(c.value);saveCandle();candleView();return}const g=e.target.closest('[data-global]');if(g){laser[g.dataset.global]=n(g.value);saveLaser();laserView();return}const l=e.target.closest('[data-laser]');if(l){const x=laser.materials.find(x=>x.id===l.closest('[data-material]').dataset.material);x[l.dataset.laser]=l.dataset.laser==='name'?l.value:n(l.value);saveLaser();laserView();return}const f=e.target.closest('[data-field]');if(f){const r=exact.rows[f.closest('[data-code]').dataset.code];r[f.dataset.field]=f.dataset.field==='group'?f.value:n(f.value);saveExact();products();return}if(e.target.id==='search')products()});document.querySelector('#save').onclick=async()=>{note('Buluta kaydediliyor...');note(await window.parent?.woodartSaveAllCostData?.()?'Buluta kaydedildi.':'Önce yönetici girişi yapın.')};document.querySelector('#load').onclick=async()=>{note('Buluttan alınıyor...');note(await window.parent?.woodartReloadCostWorkbook?.()?'Buluttan güncellendi.':'Bulut verisi alınamadı.')};sync();laserView();candleView();products()})();
</script></body></html>
