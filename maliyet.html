<!doctype html><script src="mobile-input-fix.js?v=1"></script>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel maliyet tablosu</title><style>
:root{--green:#174a35;--ink:#17231e;--muted:#64736a;--line:#dbe3dd;--paper:#f7f8f5;--cream:#fff9ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px Arial,sans-serif;color:var(--ink)}.wrap{max-width:1400px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1,.head h2{margin:0}.head h1{font-size:25px}.muted{color:var(--muted);margin:5px 0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{border:1px solid #b8c9bf;background:#fff;color:var(--green);border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}.button.primary{background:var(--green);border-color:var(--green);color:#fff}.search{min-width:245px;border:1px solid #cbd7cf;border-radius:8px;padding:10px;font:inherit}.rates{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.rate{background:var(--cream);border:1px solid #eadfc8;border-radius:9px;padding:10px}.rate label,.field label{display:block;font-weight:700;font-size:12px;color:#536259;margin-bottom:6px}input,select{width:100%;font:inherit;border:1px solid #cbd7cf;border-radius:7px;padding:8px;background:#fff}.table{width:100%;border-collapse:collapse}.table th{background:#edf4ef;font-size:12px;text-align:left;padding:10px 7px}.table td{border-bottom:1px solid var(--line);padding:7px}.table img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#eef2ed}.table .name{font-weight:700;min-width:160px}.number{font-weight:700;white-space:nowrap}.empty{padding:24px;color:var(--muted);text-align:center}.file{display:none}.notice{min-height:18px;color:var(--green);font-weight:700}
@media(max-width:700px){.wrap{padding:10px}.card{padding:13px}.head{align-items:stretch}.head h1{font-size:21px}.tools{width:100%}.tools .button{flex:1;padding:9px 6px;font-size:12px}.search{width:100%;min-width:0}.rates{grid-template-columns:1fr}.table,.table tbody,.table tr,.table td{display:block;width:100%}.table thead{display:none}.table tr{border:1px solid var(--line);border-radius:10px;padding:9px;margin:0 0 10px;background:#fff}.table td{display:grid;grid-template-columns:42% minmax(0,1fr);gap:8px;align-items:center;padding:7px 1px}.table td:before{content:attr(data-label);font-size:12px;font-weight:700;color:#536259}.table td:first-child{display:flex;justify-content:space-between}.table td:last-child{border-bottom:0}.table img{width:48px;height:48px}.table .name{min-width:0}.table input,.table select{min-width:0}.number{text-align:left}}
</style></head><body><main class="wrap"><section class="card"><div class="head"><div><h1>Ürün maliyetleri</h1><p class="muted">Excel maliyet tablosu</p></div><div class="tools"><button class="button" id="export">↓ Excel al</button><button class="button" id="import">↑ Excel yükle</button><button class="button primary" id="sync">Stokları yenile</button><input class="file" id="file" type="file" accept=".csv,text/csv"></div></div></section><section class="card"><div class="head"><div><h2>Hammadde girişleri</h2><p class="muted">Birim maliyet ve satış çarpanları</p></div></div><div class="rates" id="rates"></div></section><section class="card"><div class="head"><div><h2>Stok listesi</h2><p class="muted" id="count"></p></div><input class="search" id="search" type="search" autocomplete="off" placeholder="Ürün veya stok kodu ara..."></div><div id="list"></div><p class="notice" id="notice"></p></section></main><script>
(()=>{const KEY='woodart-kitap121-exact-v2',DATA='woodart-demo-data',base={rates:{stone:.04,mdf:.55,candle:.35,retail:2.5,online:5},rows:{}};const num=v=>Number(String(v??'').replace(',','.'))||0,esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;'),money=v=>'₺ '+num(v).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});const load=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return{...base,...x,rates:{...base.rates,...(x.rates||{})},rows:x.rows||{}}}catch{return structuredClone(base)}};let state=load();const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));setTimeout(()=>window.parent?.woodartSaveAllCostData?.(),0)};const stocks=()=>{try{return JSON.parse(localStorage.getItem(DATA)||'{}').stock||[]}catch{return[]}};const calc=r=>{const group=r.group||'stone',amount=group==='mdf'?num(r.mdfAmount):num(r.multiplier)*num(r.mouldWater),water=group==='mdf'?0:amount*num(r.mixRatio),rate=group==='mdf'?num(state.rates.mdf):group==='candle'?num(state.rates.candle):num(state.rates.stone),cost=amount*rate;return{amount,water,cost,min:cost*num(state.rates.retail),online:cost*num(state.rates.online)}};const merge=()=>{stocks().forEach(stock=>{const old=state.rows[stock.code]||{},p=stock.costFormula||stock.costParams||{};state.rows[stock.code]={code:stock.code,name:stock.name||old.name||'',image:stock.image||old.image||'stok-urunleri.png',group:old.group??p.group??'stone',multiplier:old.multiplier??p.multiplier??p.factor??1.46,mixRatio:old.mixRatio??p.mixRatio??p.ratio??.35,mouldWater:old.mouldWater??p.mouldWater??p.water??240,mdfAmount:old.mdfAmount??p.mdfAmount??p.quantity??0}});save();render()};const rateView=()=>{document.querySelector('#rates').innerHTML=[['stone','Taş tozu (₺ / gr)'],['mdf','MDF (₺ / birim)'],['candle','Mum (₺ / gr)'],['retail','Minimum satış çarpanı'],['online','İnternet satış çarpanı']].map(([k,l])=>`<div class="rate"><label>${l}</label><input data-rate="${k}" type="number" step="0.01" value="${state.rates[k]}"></div>`).join('')};const row=r=>{const o=calc(r),mdf=r.group==='mdf';return `<tr data-code="${esc(r.code)}"><td data-label="Görsel"><img src="${esc(r.image)}" alt=""></td><td data-label="Stok kodu">${esc(r.code)}</td><td data-label="Stok adı" class="name">${esc(r.name)}</td><td data-label="Maliyet grubu"><select data-field="group"><option value="stone" ${r.group==='stone'?'selected':''}>Taş tozu</option><option value="mdf" ${mdf?'selected':''}>MDF</option><option value="candle" ${r.group==='candle'?'selected':''}>Mum</option></select></td><td data-label="Su çarpanı"><input data-field="multiplier" type="number" step="0.01" value="${r.multiplier}" ${mdf?'disabled':''}></td><td data-label="Karıştırma oranı"><input data-field="mixRatio" type="number" step="0.01" value="${r.mixRatio}" ${mdf?'disabled':''}></td><td data-label="Kalıbın aldığı su"><input data-field="mouldWater" type="number" step="0.01" value="${r.mouldWater}" ${mdf?'disabled':''}></td><td data-label="Ürün miktarı">${mdf?`<input data-field="mdfAmount" type="number" step="0.01" value="${r.mdfAmount}">`:`<span class="number">${o.amount.toLocaleString('tr-TR',{maximumFractionDigits:2})}</span>`}</td><td data-label="Su miktarı" class="number">${o.water.toLocaleString('tr-TR',{maximumFractionDigits:2})}</td><td data-label="Maliyet" class="number">${money(o.cost)}</td><td data-label="Minimum satış" class="number">${money(o.min)}</td><td data-label="İnternet satış" class="number">${money(o.online)}</td></tr>`};function render(){const term=document.querySelector('#search')?.value.toLocaleLowerCase('tr-TR').trim()||'',rows=Object.values(state.rows).filter(r=>!term||(r.code+' '+r.name).toLocaleLowerCase('tr-TR').includes(term));document.querySelector('#list').innerHTML=rows.length?`<table class="table"><thead><tr><th>Görsel</th><th>Kod</th><th>Stok adı</th><th>Grup</th><th>Su çarpanı</th><th>Karıştırma</th><th>Kalıbın suyu</th><th>Ürün miktarı</th><th>Su miktarı</th><th>Maliyet</th><th>Minimum</th><th>İnternet</th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table>`:'<p class="empty">Aramanızla eşleşen stok bulunamadı.</p>';document.querySelector('#count').textContent=`${rows.length} / ${Object.keys(state.rows).length} stok gösteriliyor`;rateView()}document.querySelector('#search').addEventListener('input',render);document.addEventListener('input',e=>{const rate=e.target.closest('[data-rate]');if(rate){state.rates[rate.dataset.rate]=num(rate.value);save();render();return}const field=e.target.closest('[data-field]');if(!field)return;const r=state.rows[field.closest('tr').dataset.code];r[field.dataset.field]=field.dataset.field==='group'?field.value:num(field.value);save();if(field.dataset.field==='group')render();else{const tr=field.closest('tr'),o=calc(r);const cells=tr.querySelectorAll('td');cells[8].textContent=o.water.toLocaleString('tr-TR',{maximumFractionDigits:2});cells[9].textContent=money(o.cost);cells[10].textContent=money(o.min);cells[11].textContent=money(o.online)}});document.querySelector('#sync').onclick=()=>{merge();document.querySelector('#notice').textContent='Stoklar eklendi; mevcut maliyet kayıtları korundu.'};document.querySelector('#export').onclick=()=>{const h=['Stok kodu','Stok adı','Maliyet grubu','Su çarpanı','Karıştırma oranı','Kalıbın aldığı su miktarı','Ürün miktarı'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"',lines=[h.map(q).join(';'),...Object.values(state.rows).map(r=>[r.code,r.name,r.group,r.multiplier,r.mixRatio,r.mouldWater,r.mdfAmount].map(q).join(';'))],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='woodart-excel-maliyet.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parse=l=>l.split(';').map(x=>x.trim().replace(/^"|"$/g,'').replaceAll('""','"')),lines=String(reader.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),h=parse(lines.shift()),at=k=>h.indexOf(k);if(at('Stok kodu')<0)throw Error('Stok kodu sütunu bulunamadı.');lines.forEach(line=>{const c=parse(line),r=state.rows[c[at('Stok kodu')]];if(!r)return;r.name=c[at('Stok adı')]||r.name;r.group=c[at('Maliyet grubu')]||r.group;r.multiplier=num(c[at('Su çarpanı')])||r.multiplier;r.mixRatio=num(c[at('Karıştırma oranı')])||r.mixRatio;r.mouldWater=num(c[at('Kalıbın aldığı su miktarı')])||r.mouldWater;r.mdfAmount=num(c[at('Ürün miktarı')])||r.mdfAmount});save();render();document.querySelector('#notice').textContent='Excel verileri içe aktarıldı.'}catch(err){document.querySelector('#notice').textContent=err.message}};reader.readAsText(file,'utf-8');e.target.value=''};render()})();
</script></body></html>
