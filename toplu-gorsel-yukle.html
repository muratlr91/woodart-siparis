<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodart · Toplu görsel yükleme</title><style>body{font:16px Arial;background:#f7f4ee;color:#173b2a;margin:0}main{max-width:720px;margin:48px auto;padding:28px;background:#fff;border-radius:16px}h1{margin-top:0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #d9ded9;width:100%;box-sizing:border-box;margin:7px 0}button{background:#174d35;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.note{background:#edf5ef;padding:14px;border-radius:8px;line-height:1.5}.status{min-height:24px;margin-top:15px;font-weight:bold;color:#174d35}.error{color:#a43c22}</style><main><h1>Toplu görsel yükleme</h1><p>Dosya adını stok koduyla başlatın: <b>ST-001_1.jpg</b>, <b>ST-001_2.jpg</b>. Her stok için en fazla 5 görsel seçebilirsiniz.</p><input id="email" type="email" placeholder="Yönetici e-postası"><input id="password" type="password" placeholder="Parola"><button id="login">Giriş yap</button><div id="uploadArea" hidden><div class="note">İlk görsel kapak görseli olur. Büyük dosyaları yüklemeden önce küçültmeniz gerekebilir.</div><input id="files" type="file" accept="image/*" multiple><button id="upload">Görselleri Supabase’e yükle</button></div><div id="status" class="status"></div></main><script>(()=>{const url='https://lpxexvjfxvxsdikkfctn.supabase.co',key='sb_publishable_wONifG2qgvZs7oAWpR0iZQ_q3CADUj7',bucket='product-images',s=document.querySelector('#status');let token='',data;const say=(text,error=false)=>{s.textContent=text;s.className='status'+(error?' error':'')};const api=(path,opts={})=>fetch(url+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});document.querySelector('#login').onclick=async()=>{const email=document.querySelector('#email').value,password=document.querySelector('#password').value;if(!email||!password)return say('E-posta ve parola girin.',true);say('Bağlanıyor...');try{const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok)throw Error('Giriş bilgileri hatalı.');token=(await r.json()).access_token;const state=await api('/rest/v1/panel_state?select=data&id=eq.1');const rows=await state.json();if(!rows[0]?.data?.stock)throw Error('Stok listesi alınamadı.');data=rows[0].data;document.querySelector('#uploadArea').hidden=false;say(data.stock.length+' stok kartı hazır. Görselleri seçin.')}catch(e){say(e.message,true)}};document.querySelector('#upload').onclick=async()=>{const files=[...document.querySelector('#files').files];if(!files.length)return say('Önce görselleri seçin.',true);const stocks=[...data.stock].sort((a,b)=>String(b.code||'').length-String(a.code||'').length),groups=new Map(),unknown=[];for(const file of files){const name=file.name.replace(/\.[^.]+$/,'').toUpperCase(),stock=stocks.find(x=>name.startsWith(String(x.code||'').toUpperCase()));if(!stock)unknown.push(file.name);else{const a=groups.get(stock)||[];a.push(file);groups.set(stock,a)}}if(!groups.size)return say('Stok kodu eşleşmedi. Örnek: ST-001_1.jpg',true);if([...groups.values()].some(x=>x.length>5))return say('Bir stok için 5’ten fazla görsel seçildi.',true);if(!confirm(groups.size+' stok için '+files.length+' görsel yüklensin mi?'))return;const b=document.querySelector('#upload');b.disabled=true;let done=0;try{for(const [stock,list] of groups){const urls=[];for(const f of list){say('Yükleniyor '+(++done)+'/'+files.length);const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=stock.code+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext,r=await fetch(url+'/storage/v1/object/'+bucket+'/'+path,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error(f.name+' yüklenemedi.');urls.push(url+'/storage/v1/object/public/'+bucket+'/'+path)}stock.image=urls[0];stock.images=urls}say('Kayıtlar güncelleniyor...');const saved=await api('/rest/v1/panel_state?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:1,data,updated_at:new Date().toISOString()})});if(!saved.ok)throw Error('Panel kaydı tamamlanamadı.');const products=data.stock.map(x=>({stock_code:x.code,name:x.name,unit:x.unit||'Adet',unit_price:Number(x.price)||0,quantity:Number(x.count)||0,critical_stock:Number(x.criticalLevel)||0,category:x.category||null,image_url:x.image||null,flags:{images:(x.images||[]).slice(0,5)},active:true}));const pr=await api('/rest/v1/products?on_conflict=stock_code',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(products)});if(!pr.ok)throw Error('Müşteri sayfası kaydı tamamlanamadı.');say('Tamamlandı: '+groups.size+' stok için görseller kaydedildi.'+(unknown.length?' '+unknown.length+' dosya eşleşmedi.':''))}catch(e){say(e.message,true)}finally{b.disabled=false}})})();</script></html>
