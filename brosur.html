<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodart | Ürün Broşürü</title>
<style>
:root{--forest:#173b2a;--cream:#faf8f3;--line:#d8e2da;--muted:#607167;--ink:#213129}*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.actions{position:sticky;top:0;z-index:3;display:flex;justify-content:center;gap:10px;padding:12px;background:var(--forest)}button{border:0;border-radius:8px;padding:10px 15px;background:#fff;color:var(--forest);font:700 14px Arial;cursor:pointer}.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}#pages{display:grid;gap:16px;padding:16px 0}.brochure-page{width:210mm;height:297mm;margin:auto;padding:12mm;background:#fff;overflow:hidden;box-shadow:0 3px 22px rgba(0,0,0,.14);display:flex;flex-direction:column}.page-head{flex:0 0 auto;border-bottom:2px solid var(--forest);padding:0 0 5mm;display:flex;justify-content:space-between;gap:8mm;align-items:flex-end}.brand{font-size:21px;letter-spacing:.4px;font-weight:900;color:var(--forest)}.brand span{color:#bd8957}.head-links{display:flex;flex-direction:column;gap:2px;text-align:right;font-size:9px;line-height:1.35}.head-links a{color:var(--forest);font-weight:700;overflow-wrap:anywhere}.category-title{margin:5mm 0 3mm;color:var(--forest);font-size:14px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm;align-content:start}.item{height:105mm;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0}.photo{height:79mm;background:var(--cream);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;display:block}.item-body{padding:3mm 3.3mm;min-height:22mm;overflow:hidden}.item h3{font-size:11px;line-height:1.22;margin:0;overflow-wrap:anywhere}.item p{margin:2px 0 0;font-size:8.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}.page-foot{margin-top:auto;padding-top:4mm;color:var(--muted);font-size:8px;display:flex;justify-content:space-between;border-top:1px solid var(--line)}.empty{margin:auto;color:var(--muted);text-align:center}.page-number{font-weight:700}@page{size:A4;margin:0}@media print{body{background:#fff}.actions{display:none}#pages{display:block;padding:0}.brochure-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}.brochure-page:last-child{break-after:auto;page-break-after:auto}}@media(max-width:760px){#pages{padding:0;gap:0}.brochure-page{width:100%;height:auto;min-height:297mm;padding:6mm;box-shadow:none}.page-head{gap:4mm}.brand{font-size:17px}.catalog{gap:3mm}.item{height:83mm}.photo{height:60mm}.item h3{font-size:9px}.item p{font-size:7px}.head-links{font-size:7px}}
.catalog{gap:3.5mm}.item{height:50mm;border-radius:7px;box-shadow:0 2px 8px rgba(20,55,38,.08)}.photo{height:35mm;position:relative;display:flex;align-items:center;justify-content:center;padding:2mm;border:1px solid #cfdbd0;background:linear-gradient(145deg,#eef4ee,#e1ebe2)}.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 48%);pointer-events:none}.photo img{position:relative;z-index:1;display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center}.category-chip{position:absolute;z-index:2;left:2.5mm;bottom:2.5mm;max-width:calc(100% - 5mm);padding:1.1mm 2mm;border-radius:99px;background:rgba(23,59,42,.9);color:#fff;font-size:7px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-body{padding:2.2mm 2.8mm;min-height:15mm}.item h3{font-size:9.5px;line-height:1.16;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.item p{font-size:7.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category-title{margin:3mm 0 2mm;font-size:11px}.page-foot{padding-top:3mm}.page-head{display:grid;grid-template-areas:'brand title qr' 'links links links';grid-template-columns:47mm minmax(0,1fr) 25mm;gap:2.5mm 3mm;padding:4mm 4.5mm;border:0;border-radius:7px;background:linear-gradient(115deg,#123827,#286344);align-items:center}.brand{grid-area:brand;display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:2.2mm;width:47mm;color:#fff;font-family:"Segoe Print","Bradley Hand",cursive;letter-spacing:.8px;line-height:1}.brand-left{display:grid;gap:1mm}.brand .brand-wood,.brand .brand-candle{display:block;font-size:16px;font-weight:700}.brand .brand-art{color:#f0bf83;font-size:34px;font-weight:700;line-height:.85}.header-main{grid-area:title;min-width:0}.brochure-title{color:#fff;font-size:15px;font-weight:900;letter-spacing:1.4px;text-align:center;text-transform:uppercase}.head-links{grid-area:links;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.4mm;width:100%;padding:0;background:transparent}.head-links a{display:flex;align-items:center;justify-content:center;min-height:8.5mm;padding:1.8mm;border:1px solid #b8d9bd;border-radius:99px;background:#edf7ee;color:#17472d;text-decoration:none;font-size:8.3px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-links a:nth-child(2){border-color:#f0c68e;background:#fff5e7;color:#9c5918}.head-links a:nth-child(3){border-color:#b7d3ef;background:#eef7ff;color:#205781}.head-links a:nth-child(4){border-color:#b8d9bd;background:#edf7ee;color:#17472d}.order-qr{grid-area:qr;display:grid;place-items:center;gap:1px;width:25mm;padding:1.5mm;border-radius:5px;background:#fff;color:#173b2a;text-decoration:none;font-size:6.4px;font-weight:800;text-align:center}.order-qr img{display:block;width:18mm;height:18mm;image-rendering:auto}@media print{.page-head{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media(max-width:760px){.page-head{grid-template-areas:'brand qr' 'title title' 'links links';grid-template-columns:1fr auto;padding:4mm;gap:3mm}.brand{width:39mm}.brand .brand-wood,.brand .brand-candle{font-size:13px}.brand .brand-art{font-size:28px}.brochure-title{font-size:11px}.head-links{gap:2mm}.head-links a{min-height:7mm;font-size:6.6px;padding:1.5mm}.order-qr{width:18mm;font-size:5.5px}.order-qr img{width:14mm;height:14mm}.item{height:48mm}.photo{height:34mm}.item h3{font-size:8.2px}.category-chip{font-size:6px}}
</style></head><body>
<div class="actions"><button id="print-button" onclick="window.prepareBrochurePrint()">↓ PDF olarak kaydet / Yazdır</button><button class="secondary" onclick="location.reload()">↻ Ürünleri yenile</button></div>
<main id="pages"><section class="brochure-page"><p class="empty">Ürünler yükleniyor…</p></section></main>
<script>
(()=>{
 const supabase='https://lpxexvjfxvxsdikkfctn.supabase.co',key='sb_publishable_wONifG2qgvZs7oAWpR0iZQ_q3CADUj7';
 const orderUrl='https://muratlr91.github.io/woodart-siparis/';
 const api=path=>fetch(supabase+'/rest/v1/'+path,{headers:{apikey:key,Authorization:'Bearer '+key}});
 const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const text=value=>String(value||'').trim();
 const instagramUrl=value=>{const source=text(value);return source?(source.startsWith('http')?source:'https://'+source):''};
 const card=(item,priority=false)=>{const flags=item.flags||{},image=(Array.isArray(flags.images)&&flags.images[0])||item.image_url||'stok-urunleri.png',loading=priority?'eager':'lazy',fetchPriority=priority?'high':'low';return `<article class="item"><div class="photo"><img src="${esc(image)}" alt="${esc(item.name)}" loading="${loading}" decoding="async" fetchpriority="${fetchPriority}"><span class="category-chip">${esc(text(item.category)||'Diğer')}</span></div><div class="item-body"><h3>${esc(item.name)}</h3><p>${esc(item.stock_code||'')}</p></div></article>`};
 const instagramName=value=>text(value).replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').split(/[/?#]/)[0].replace(/^@/,'');
 const header=(info,page,total)=>{const instagram=[info.instagram1,info.instagram2].map(instagramUrl).filter(Boolean),phone=[info.phone,info.phone2].map(text).filter(Boolean);const chips=[...instagram.map(value=>`<a href="${esc(value)}" target="_blank" rel="noopener">Instagram · @${esc(instagramName(value))}</a>`),...phone.map(value=>`<a href="tel:${esc(value.replace(/[^+0-9]/g,''))}">Telefon · ${esc(value)}</a>`)] ;const qr=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&format=svg&data=${encodeURIComponent(orderUrl)}`;return `<header class="page-head"><div class="brand"><div class="brand-left"><span class="brand-wood">WOOD</span><span class="brand-candle">CANDLE</span></div><span class="brand-art">ART</span></div><div class="header-main"><div class="brochure-title">Ürün Broşürü</div></div><a class="order-qr" href="${orderUrl}" target="_blank" rel="noopener"><img src="${qr}" alt="Sipariş sayfası karekodu"><span>Sipariş için tara</span></a><div class="head-links">${chips.join('')}</div></header>`};
 const makePage=(groups,info,page,total,priority=false)=>`<section class="brochure-page">${header(info,page,total)}<div class="catalog">${groups.flatMap(group=>group.items).map(item=>card(item,priority)).join('')}</div><footer class="page-foot"><span>Woodart ürün kataloğu</span><span class="page-number">${page} / ${total}</span></footer></section>`;
 const split=items=>{const pages=[];let current=[],count=0;for(const item of items){const category=text(item.category)||'Diğer';let group=current.find(x=>x.category===category);if(!group||count>=12){if(count>=12){pages.push(current);current=[];count=0}group={category,items:[]};current.push(group)}group.items.push(item);count++}if(current.length)pages.push(current);return pages};
 const categoryRank=value=>{const category=text(value).toLocaleLowerCase('tr-TR');if(category.includes('taş')||category.includes('obje'))return 1;if(category.includes('boya'))return 2;if(category.includes('fırça')||category.includes('firca'))return 3;if(category.includes('ambalaj')||category.includes('paket')||category.includes('poşet'))return 9;return 5};
 let brochurePages=[],brochureInfo={},renderedPages=0,pageObserver;
 const appendPage=()=>{if(renderedPages>=brochurePages.length)return false;const page=renderedPages+1;document.querySelector('#pages').insertAdjacentHTML('beforeend',makePage(brochurePages[renderedPages],brochureInfo,page,brochurePages.length,page===1));renderedPages++;return true};
 const observeNextPage=()=>{if(!('IntersectionObserver'in window)||renderedPages>=brochurePages.length)return;pageObserver?.disconnect();const last=document.querySelector('#pages .brochure-page:last-child');pageObserver=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){appendPage();observeNextPage()}},{rootMargin:'900px 0px'});pageObserver.observe(last)};
 const loadAllPages=()=>{pageObserver?.disconnect();while(appendPage()){} };
 window.prepareBrochurePrint=async()=>{const button=document.querySelector('#print-button');button.disabled=true;const original=button.textContent;button.textContent='PDF hazırlanıyor…';loadAllPages();const images=[...document.images];images.forEach(image=>{image.loading='eager';image.fetchPriority='high'});await Promise.all(images.map(image=>image.complete?Promise.resolve():new Promise(resolve=>{image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true})})));button.disabled=false;button.textContent=original;window.print()};
 const render=(products,info)=>{const sorted=[...products].sort((a,b)=>{const rank=categoryRank(a.category)-categoryRank(b.category);const c=rank||(text(a.category)||'Diğer').localeCompare(text(b.category)||'Diğer','tr');return c||text(a.name).localeCompare(text(b.name),'tr')});brochurePages=split(sorted);brochureInfo=info;renderedPages=0;document.querySelector('#pages').innerHTML='';if(!brochurePages.length){document.querySelector('#pages').innerHTML='<section class="brochure-page"><p class="empty">Broşürde gösterilecek ürün bulunamadı.</p></section>';return}appendPage();observeNextPage()};
 Promise.all([api('products?select=stock_code,name,category,image_url,flags&active=eq.true'),api('storefront_settings?select=public_data&id=eq.1')]).then(async([productsResponse,settingsResponse])=>{if(!productsResponse.ok)throw Error();const products=await productsResponse.json(),settings=settingsResponse.ok?await settingsResponse.json():[];render(products,settings[0]?.public_data?.contactInfo||{})}).catch(()=>{document.querySelector('#pages').innerHTML='<section class="brochure-page"><p class="empty">Ürünler şu an yüklenemedi. Bağlantınızı kontrol edip yenileyin.</p></section>'});
})();
</script></body></html>
