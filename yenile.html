<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173b2a">
  <title>Woodart güncelleniyor</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f4ee;color:#173b2a;font:16px Arial,sans-serif}.box{max-width:360px;padding:30px;text-align:center;background:#fff;border-radius:16px;box-shadow:0 14px 36px #173b2a22}h1{margin:0 0 12px;font-size:23px}p{margin:0;line-height:1.5;color:#607067}.spin{width:32px;height:32px;margin:0 auto 18px;border:4px solid #dbe9df;border-top-color:#173b2a;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <main class="box"><div class="spin"></div><h1>Woodart güncelleniyor</h1><p>Eski uygulama önbelleği temizleniyor. Yönetim paneli birazdan açılacak.</p></main>
  <script>
    (async()=>{try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()))}if('caches'in window){const names=await caches.keys();await Promise.all(names.filter(name=>name.startsWith('woodart-')).map(name=>caches.delete(name)))}}finally{location.replace('yonetim.html?sayfa=ozet&yenile='+Date.now())}})();
  </script>
</body>
</html>
