  <style>
    :root{--forest:#173b2a;--wood:#b27643;--cream:#f7f4ee;--ink:#26342c;--line:#e5e1d7;--soft:#eff6f0;--red:#b34b40}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Inter,Segoe UI,Arial,sans-serif}.top{background:var(--forest);color:#fff;padding:22px max(20px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:11px;align-items:center;font-size:22px;font-weight:850;letter-spacing:.7px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:contain;background:white}.brand span{color:#e9b57d}.top small{color:#d2e0d5}.wrap{max-width:1160px;margin:0 auto;padding:30px 20px 50px}.intro{margin-bottom:24px}.intro h1{font-size:29px;margin:0 0 8px}.intro p{margin:0;color:#67756c}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.panel h2{font-size:18px;margin:0 0 16px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}.product img{height:65px;width:72px;object-fit:cover;border-radius:7px}.product h3{font-size:14px;margin:0 0 5px}.product small{color:#738077;display:block;margin-bottom:7px}.price{font-size:16px;font-weight:800;color:var(--forest)}button{font:inherit}.add{margin-top:8px;border:1px solid var(--forest);background:#fff;color:var(--forest);padding:7px 10px;border-radius:7px;font-weight:700;cursor:pointer}.cart{position:sticky;top:16px}.empty{color:#748178;font-size:14px;padding:12px 0}#cart{max-height:306px;overflow-y:auto;padding-right:5px}.cart-line{display:grid;grid-template-columns:1fr 62px auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:11px 0}.cart-line strong{font-size:13px}.cart-line small{display:block;color:#748178;margin-top:3px}.cart input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.remove{background:transparent;color:var(--red);border:0;cursor:pointer}.shipping{border-top:1px solid var(--line);margin-top:8px;padding:11px 0 2px}.shipping label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--forest);cursor:pointer}.shipping input[type=checkbox]{width:16px;height:16px}.shipping-price{display:none;margin-top:9px}.shipping-price input{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px}.total{display:flex;justify-content:space-between;border-top:2px solid var(--forest);padding-top:14px;margin-top:9px;font-size:16px;font-weight:800}.field{display:grid;gap:6px;margin-top:13px}.field label{font-size:13px;color:#57655c}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.field textarea{resize:vertical;min-height:70px}.send{width:100%;border:0;background:var(--forest);color:#fff;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:18px}.notice{display:none;margin-top:14px;background:var(--soft);border:1px solid #cde0d0;color:var(--forest);padding:12px;border-radius:8px;line-height:1.45}.footer{text-align:center;color:#738077;font-size:12px;margin-top:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:1fr}.top small{display:none}}@media(max-width:430px){.product{grid-template-columns:58px 1fr}.product img{width:58px;height:54px}.wrap{padding:22px 14px}}
    .contact-links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 20px}.contact-links a{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbded0;background:#fff;color:var(--forest);padding:8px 12px;border-radius:99px;text-decoration:none;font-size:13px;font-weight:750}.contact-links a:nth-child(1),.contact-links a:nth-child(4){background:#ecf7ef;border-color:#bbdcc4}.contact-links a:nth-child(2){background:#fff2e4;border-color:#efc995;color:#8a541e}.contact-links a:nth-child(3){background:#edf5ff;border-color:#bad3ed;color:#275d86}.contact-links a:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,59,42,.12)}body{background:linear-gradient(135deg,#f8f5ef 0%,#edf5ef 100%)}.intro{background:linear-gradient(115deg,#173b2a,#2d6a4b);color:#fff;padding:22px 24px;border-radius:14px;box-shadow:0 9px 22px rgba(23,59,42,.12)}.intro h1{color:#fff}.intro p{color:#dcebe0}.panel{box-shadow:0 8px 22px rgba(38,52,44,.05)}.catalog-tools{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:9px;margin:-3px 0 16px}.catalog-tools input,.catalog-tools select{width:100%;padding:10px;border:1px solid #cbded0;border-radius:8px;background:#f9fffa}.products{max-height:calc(100vh - 360px);min-height:260px;overflow-y:auto;overflow-x:hidden;padding-right:8px;align-content:start}.product{border-color:#d7e4d9;transition:transform .16s,box-shadow .16s;background:#fcfffc}.product:nth-child(4n+2){background:#fffaf2;border-color:#eadbc5}.product:nth-child(4n+3){background:#f4fbf6;border-color:#cfe5d5}.product:nth-child(4n+4){background:#f5f9fd;border-color:#cfdeed}.product.campaign{border:2px solid #d69a3a;background:#fff8e8}.product.discount{border:2px solid #dc6a61;background:#fff0ef}.product.opportunity{border:2px solid #8566bd;background:#f5f0ff}.product.new-product{border:2px solid #3b89bd;background:#edf7ff}.product-tags{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 6px}.product-tags span{font-size:10px;font-weight:800;border-radius:99px;padding:3px 6px;background:#edf2ed;color:var(--forest)}.product-tags .campaign{background:#f7dfae;color:#80500c}.product-tags .discount{background:#f8cbc7;color:#99352e}.product-tags .opportunity{background:#dcd0f5;color:#54398b}.product-tags .new-product{background:#c8e7f8;color:#1e628e}.product:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(23,59,42,.1)}.add{background:#fff}.add:hover{background:var(--forest);color:#fff}.cart{border-top:4px solid #c98b50;background:#fffdf9}.shipping{background:#f1f8f3;padding:11px;border-radius:8px;border-top:0}.total{border-top-color:#c98b50}.send{background:linear-gradient(90deg,#173b2a,#2f7251)}.product-photo{position:relative;padding:0;border:0;background:transparent;cursor:pointer;width:72px;height:65px}.product-photo img{height:65px;width:72px;object-fit:cover;border-radius:7px}.product-photo span{position:absolute;right:-4px;bottom:-4px;background:var(--forest);color:#fff;border-radius:99px;padding:3px 5px;font-size:10px;font-weight:800}.gallery-lightbox{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,30,22,.82);padding:24px}.gallery-lightbox.show{display:grid}.gallery-frame{position:relative;max-width:min(760px,94vw);max-height:88vh;background:#fff;border-radius:12px;padding:12px}.gallery-frame img{display:block;max-width:100%;max-height:76vh;object-fit:contain;border-radius:8px}.gallery-close,.gallery-nav{position:absolute;border:0;cursor:pointer;background:#173b2a;color:#fff;font-size:18px;font-weight:800;border-radius:50%;width:38px;height:38px}.gallery-close{right:-12px;top:-12px}.gallery-nav{top:50%;transform:translateY(-50%)}.gallery-prev{left:-52px}.gallery-next{right:-52px}.gallery-caption{text-align:center;padding:9px 2px 1px;font-weight:700;color:#173b2a}@media(max-width:800px){.products{max-height:none;overflow:visible;padding-right:0}.gallery-prev{left:6px}.gallery-next{right:6px}.gallery-nav{background:rgba(23,59,42,.8)}}
  </style>
  <style>
    .products.woodart-remote-loading{display:block;padding:54px 12px;text-align:center;color:#67756c}
    .products.woodart-remote-loading>*{display:none}
    .products.woodart-remote-loading::after{content:'Güncel ürünler yükleniyor…';font-weight:700}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><img src="woodart-logo.png" alt="Woodart logo">WOOD<span>ART</span></div><small>Ürün seçimi ve sipariş talebi</small></header>
  <main class="wrap"><div class="intro"><h1>Sipariş oluştur</h1><p>Ürünleri seçin, miktarları belirtin ve sipariş talebinizi gönderin.</p></div><div class="contact-links" id="contact-links"></div><div class="layout"><section class="panel"><h2>Ürünler</h2><div class="catalog-tools"><input id="product-search" placeholder="Ürün ara..."><select id="category-filter"><option value="">Tüm kategoriler</option></select><select id="product-sort"><option value="default">Sıralama</option><option value="name-asc">Ada göre A–Z</option><option value="name-desc">Ada göre Z–A</option><option value="price-asc">Fiyat: düşükten yükseğe</option><option value="price-desc">Fiyat: yüksekten düşüğe</option></select></div><div class="products" id="products"></div></section><aside class="panel cart"><h2>Seçtiğiniz ürünler</h2><div id="cart"></div><div class="shipping"><label><input id="shipping-selected" type="checkbox"> Kargo istiyorum</label><div class="shipping-price" id="shipping-price"><input id="shipping-amount" type="text" readonly></div></div><div class="total"><span>Toplam</span><span id="total">₺ 0,00</span></div><form id="order-form"><div class="field"><label for="customer">Adınız / firma adınız</label><input id="customer" required placeholder="Ad soyad veya firma adı"></div><div class="field"><label for="phone">Telefon</label><input id="phone" required type="tel" placeholder="05xx xxx xx xx"></div><div class="field"><label for="note">Sipariş notu <small>(isteğe bağlı)</small></label><textarea id="note" placeholder="Teslimat veya ürünle ilgili notunuz"></textarea></div><button class="send" type="submit">Sipariş talebini gönder</button><div class="notice" id="notice"></div></form></aside></div><div class="footer">Woodart · Sipariş talebiniz firma onayı sonrasında kesinleşir.</div></main><div class="gallery-lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Ürün görseli"><div class="gallery-frame"><button type="button" class="gallery-close" aria-label="Kapat">×</button><button type="button" class="gallery-nav gallery-prev" aria-label="Önceki görsel">‹</button><img alt=""><button type="button" class="gallery-nav gallery-next" aria-label="Sonraki görsel">›</button><div class="gallery-caption"></div></div></div>
  <script>document.querySelector('#products')?.classList.add('woodart-remote-loading');</script>
  <script>
    const panelKey='woodart-demo-data',supabaseUrl='https://lpxexvjfxvxsdikkfctn.supabase.co',supabaseKey='sb_publishable_wONifG2qgvZs7oAWpR0iZQ_q3CADUj7',fallbackProducts=[
      {code:'ST-101',name:'Meşe masif panel 18 mm',unit:'Levha',price:1850,count:99,image:'stok-urunleri.png'},
      {code:'ST-203',name:'Ahşap koruyucu yağ',unit:'Litre',price:420,count:99,image:'stok-urunleri.png'},
      {code:'ST-118',name:'Mat siyah kulp 160 mm',unit:'Adet',price:95,count:99,image:'stok-urunleri.png'}
    ];
    let panelData=null;try{panelData=JSON.parse(localStorage.getItem(panelKey)||'null')}catch(error){};
    let products=(panelData?.stock?.length?panelData.stock:fallbackProducts).map(item=>{const images=(Array.isArray(item.images)&&item.images.length?item.images:[item.image||'stok-urunleri.png']).slice(0,5);return {code:item.code,name:item.name,category:item.category||'Diğer',unit:item.unit,price:Number(item.price)||0,count:Number(item.count)||0,image:images[0],images,campaign:item.campaign==='Evet'||item.campaign==='on'||item.campaign===true,discount:item.discount==='Evet'||item.discount==='on'||item.discount===true,opportunity:item.opportunity==='Evet'||item.opportunity==='on'||item.opportunity===true,newProduct:item.newProduct==='Evet'||item.newProduct==='on'||item.newProduct===true}});
    const categoryFilter=document.querySelector('#category-filter'),productSearch=document.querySelector('#product-search'),productSort=document.querySelector('#product-sort');const refreshCategories=()=>{categoryFilter.innerHTML='<option value="">Tüm kategoriler</option>';[...new Set(products.map(item=>item.category))].sort().forEach(category=>{const option=document.createElement('option');option.value=category;option.textContent=category;categoryFilter.appendChild(option)})};refreshCategories();
    const renderContacts=()=>{const holder=document.querySelector('#contact-links'),info=panelData?.contactInfo||{},platforms=panelData?.salesPlatforms||{};holder.innerHTML='';const addLink=(text,href)=>{const link=document.createElement('a');link.href=href;link.target='_blank';link.rel='noopener';link.textContent=text;holder.appendChild(link)};[info.instagram1,info.instagram2].filter(Boolean).forEach(address=>{const url=/^https?:\/\//i.test(address)?address:'https://'+address;let handle='Instagram';try{handle='@'+new URL(url).pathname.split('/').filter(Boolean)[0]}catch(error){}addLink('Instagram · '+handle,url)});[info.phone,info.phone2].filter(Boolean).forEach(phone=>addLink('Telefon · '+phone,'tel:'+phone.replace(/[^+\d]/g,'')));[[platforms.name1,platforms.url1],[platforms.name2,platforms.url2]].filter(([,url])=>url).forEach(([name,url])=>addLink(name||'Satış platformu',/^https?:\/\//i.test(url)?url:'https://'+url))};
    const cart=[];const money=n=>'₺ '+Number(n).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});const shippingRate=()=>{const quantity=cart.reduce((sum,item)=>sum+item.qty,0),rates=panelData?.shippingRates||{small:100,medium:250,large:500};return quantity>=20?Number(rates.large)||0:quantity>=10?Number(rates.medium)||0:Number(rates.small)||0};const shippingAmount=()=>document.querySelector('#shipping-selected').checked?shippingRate():0;const orderTotal=()=>cart.reduce((sum,item)=>sum+item.price*item.qty,0)+shippingAmount();
    const render=()=>{const query=productSearch.value.trim().toLocaleLowerCase('tr-TR'),category=categoryFilter.value,visible=products.filter(item=>(!category||item.category===category)&&(`${item.name} ${item.code}`).toLocaleLowerCase('tr-TR').includes(query)),sorted=[...visible],sort=productSort.value;if(sort==='name-asc')sorted.sort((a,b)=>a.name.localeCompare(b.name,'tr'));if(sort==='name-desc')sorted.sort((a,b)=>b.name.localeCompare(a.name,'tr'));if(sort==='price-asc')sorted.sort((a,b)=>a.price-b.price);if(sort==='price-desc')sorted.sort((a,b)=>b.price-a.price);document.querySelector('#products').innerHTML=sorted.map(p=>{const i=products.indexOf(p);return `<article class="product ${p.campaign?'campaign':''} ${p.discount?'discount':''} ${p.opportunity?'opportunity':''} ${p.newProduct?'new-product':''}"><button type="button" class="product-photo" data-gallery="${i}" aria-label="${p.name} görsellerini görüntüle"><img src="${p.image}" alt="${p.name}">${p.images.length>1?`<span>+${p.images.length-1}</span>`:''}</button><div><div class="product-tags">${p.campaign?'<span class="campaign">Kampanyalı</span>':''}${p.discount?'<span class="discount">İndirimli</span>':''}${p.opportunity?'<span class="opportunity">Fırsat ürünü</span>':''}${p.newProduct?'<span class="new-product">Yeni ürün</span>':''}</div><h3>${p.name}</h3><small>${p.category} · ${p.code} · ${p.unit}${panelData?` · ${p.count>0?p.count+' adet mevcut':'Stokta yok · sipariş verilebilir'}`:''}</small><div class="price">${money(p.price)}</div><button class="add" data-add="${i}">+ Sepete ekle</button></div></article>`}).join('')||'<div class="empty">Aramanıza uygun ürün bulunamadı.</div>';const holder=document.querySelector('#cart');holder.innerHTML=cart.length?cart.map((x,i)=>`<div class="cart-line"><div><strong>${x.name}</strong><small>${money(x.price)} / ${x.unit}</small></div><input data-qty="${i}" type="number" min="1" value="${x.qty}"><button type="button" class="remove" data-remove="${i}">Sil</button></div>`).join(''):'<div class="empty">Henüz ürün seçmediniz.</div>';document.querySelector('#shipping-amount').value=document.querySelector('#shipping-selected').checked?money(shippingRate()):'';document.querySelector('#total').textContent=money(orderTotal())};
    document.addEventListener('click',e=>{const add=e.target.closest('[data-add]'),remove=e.target.closest('[data-remove]');if(add){const p=products[Number(add.dataset.add)],row=cart.find(x=>x.code===p.code);if(row)row.qty++;else cart.push({...p,qty:1});render()}if(remove){cart.splice(Number(remove.dataset.remove),1);render()}});document.addEventListener('input',e=>{const input=e.target.closest('[data-qty]');if(!input)return;const item=cart[Number(input.dataset.qty)];if(item){item.qty=Math.max(1,Number(input.value)||1);render()}});productSearch.addEventListener('input',render);categoryFilter.addEventListener('change',render);productSort.addEventListener('change',render);document.querySelector('#shipping-selected').addEventListener('change',e=>{document.querySelector('#shipping-price').style.display=e.target.checked?'block':'none';render()});
    const api=(path,options={})=>fetch(supabaseUrl+'/rest/v1/'+path,{...options,headers:{apikey:supabaseKey,Authorization:'Bearer '+supabaseKey,'Content-Type':'application/json',...(options.headers||{})}});
    const loadRemoteStorefront=async()=>{try{const [productsResponse,settingsResponse]=await Promise.all([api('products?select=stock_code,name,unit,unit_price,quantity,category,image_url,flags&active=eq.true&order=name.asc'),api('storefront_settings?select=public_data&id=eq.1')]);if(!productsResponse.ok)throw new Error('Ürünler alınamadı');const remoteProducts=await productsResponse.json(),settings=settingsResponse.ok?await settingsResponse.json():[];if(remoteProducts.length){products=remoteProducts.map(item=>{const flags=item.flags||{},images=(Array.isArray(flags.images)&&flags.images.length?flags.images:[item.image_url||'stok-urunleri.png']).slice(0,5);return {code:item.stock_code,name:item.name,unit:item.unit,price:Number(item.unit_price)||0,count:Number(item.quantity)||0,category:item.category||'Diğer',image:images[0],images,campaign:!!flags.campaign,discount:!!flags.discount,opportunity:!!flags.opportunity,newProduct:!!flags.newProduct}})}if(settings[0]?.public_data){panelData={...(panelData||{}),...settings[0].public_data}}refreshCategories();renderContacts();render()}catch(error){console.warn('Çevrimiçi ürünler yüklenemedi',error)}};
    document.querySelector('#order-form').addEventListener('submit',async e=>{e.preventDefault();if(!cart.length){alert('Lütfen en az bir ürün seçin.');return}const customer=document.querySelector('#customer').value.trim(),phone=document.querySelector('#phone').value.trim(),note=document.querySelector('#note').value.trim(),cargo=shippingAmount(),total=orderTotal(),button=e.target.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Gönderiliyor...';try{const response=await api('customer_requests',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_name:customer,phone,note,items:cart.map(item=>({stockCode:item.code,name:item.name,qty:item.qty,price:item.price})),shipping_requested:document.querySelector('#shipping-selected').checked,shipping_amount:cargo,total_amount:total})});if(!response.ok)throw new Error('Sipariş talebi kaydedilemedi');document.querySelector('#notice').textContent='Sipariş talebiniz başarıyla gönderildi. Firma onayından sonra sizinle iletişime geçilecektir.';e.target.reset();document.querySelector('#shipping-selected').checked=false;document.querySelector('#shipping-price').style.display='none';cart.splice(0);render()}catch(error){document.querySelector('#notice').textContent='Talep şu an gönderilemedi. Lütfen tekrar deneyin veya telefonla iletişime geçin.'}finally{button.disabled=false;button.textContent='Sipariş talebini gönder';document.querySelector('#notice').style.display='block'}});document.addEventListener('click',event=>{const button=event.target.closest('[data-gallery]');if(!button)return;const product=products[Number(button.dataset.gallery)];if(!product?.images?.length)return;product.galleryIndex=((product.galleryIndex||0)+1)%product.images.length;button.querySelector('img').src=product.images[product.galleryIndex];button.title=`${product.galleryIndex+1}. görsel / ${product.images.length}`});const addWoodartRefreshButton=()=>{const top=document.querySelector('.top');if(!top)return;const button=document.createElement('button');button.type='button';button.textContent='↻ Yenile';button.style.cssText='margin-left:auto;border:1px solid #cbded0;background:#fff;color:#173b2a;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer';button.title='Sayfa önbelleğini yeniler; sipariş ve ürün bilgileri silinmez.';button.onclick=async()=>{button.disabled=true;try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.update()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(name=>name.startsWith('woodart-')).map(name=>caches.delete(name)))}}finally{location.href=location.pathname+'?yenile='+Date.now()}};top.appendChild(button)};addWoodartRefreshButton();renderContacts();render();loadRemoteStorefront();
  </script>
  <script>
    (()=>{const holder=document.querySelector('#products');if(!holder)return;const reveal=()=>{holder.classList.remove('woodart-remote-loading');observer.disconnect();clearTimeout(fallback)};const observer=new MutationObserver(()=>reveal());observer.observe(holder,{childList:true});const fallback=setTimeout(reveal,10000)})();
  </script>
  <script>
    (()=>{document.addEventListener('click',event=>{if(!event.target.closest('[data-add]'))return;const pageTop=window.scrollY,list=document.querySelector('#products'),listTop=list?.scrollTop||0;setTimeout(()=>{window.scrollTo({top:pageTop,left:0,behavior:'instant'});if(list)list.scrollTop=listTop},0)},true)})();
  </script>
  <script>
    (()=>{
      const lightbox=document.querySelector('#gallery-lightbox');
      const image=lightbox?.querySelector('img'),caption=lightbox?.querySelector('.gallery-caption');
      let productIndex=-1,imageIndex=0;
      const draw=()=>{const product=products[productIndex];if(!product)return;const images=product.images||[];imageIndex=(imageIndex+images.length)%images.length;image.src=images[imageIndex];image.alt=product.name;caption.textContent=images.length>1?`${product.name} · ${imageIndex+1}/${images.length}`:product.name};
      const close=()=>lightbox?.classList.remove('show');
      document.addEventListener('click',event=>{const button=event.target.closest('[data-gallery]');if(button){event.preventDefault();event.stopImmediatePropagation();productIndex=Number(button.dataset.gallery);imageIndex=0;draw();lightbox?.classList.add('show');return}if(event.target===lightbox||event.target.closest('.gallery-close'))close();if(event.target.closest('.gallery-prev')){imageIndex--;draw()}if(event.target.closest('.gallery-next')){imageIndex++;draw()}},true);
      document.addEventListener('keydown',event=>{if(!lightbox?.classList.contains('show'))return;if(event.key==='Escape')close();if(event.key==='ArrowLeft'){imageIndex--;draw()}if(event.key==='ArrowRight'){imageIndex++;draw()}});
    })();
  </script>
  <script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));</script>
</body>
</html>
