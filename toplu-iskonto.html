<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodart | Toplu iskonto</title><style>:root{--f:#173b2a;--c:#f7f4ee;--l:#dce4dd;--r:#b34b40}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#26342c;font:15px Arial,sans-serif}.top{background:var(--f);color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between}.top a{color:white;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:24px 18px}.box{background:white;border:1px solid var(--l);border-radius:14px;padding:18px}.login{max-width:420px;margin:45px auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.tools input{padding:11px;border:1px solid var(--l);border-radius:8px;font:inherit;width:100%}button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 13px;font-weight:bold}.main{background:var(--f);color:white;border:0}.plain{background:white;color:var(--f);border:1px solid var(--l)}.hide{display:none}.tools{display:grid;grid-template-columns:1fr 120px auto auto;gap:8px;margin:15px 0}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}.bar b{margin-right:auto}.list{max-height:58vh;overflow:auto;border:1px solid var(--l);border-radius:10px}.item{display:grid;grid-template-columns:25px 54px 1fr auto;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #edf0ed}.item img{width:54px;height:46px;object-fit:cover;border-radius:7px;background:#eee}.item b,.item small{display:block}.item small{color:#718077;margin-top:3px}.price{font-weight:bold;color:var(--f)}.note{min-height:20px;margin-top:12px;font-weight:bold}.bad{color:var(--r)}@media(max-width:650px){.tools{grid-template-columns:1fr 110px}.item{grid-template-columns:25px 48px 1fr}.price{grid-column:3}}</style></head><body><header class="top"><b>WOODART · Toplu iskonto</b><a href="yonetim.html">← Yönetim paneli</a></header><main class="wrap"><section id="login" class="box login"><h2>Yönetici girişi</h2><p>Toplu iskonto uygulamak için giriş yapın.</p><div class="field"><label>E-posta</label><input id="email" type="email"></div><div class="field"><label>Parola</label><input id="password" type="password"></div><button id="loginButton" class="main">Giriş yap</button><div id="loginNote" class="note"></div></section><section id="work" class="box hide"><h1>Seçili ürünlere toplu iskonto</h1><p>İşaretlediğiniz ürünlerin tümüne aynı yüzde uygulanır. <b>0</b> girerek iskonto kaldırabilirsiniz.</p><div class="tools"><input id="search" placeholder="Ürün adı veya stok kodu ara..."><input id="rate" type="number" min="0" max="100" value="0"><button id="selectAll" class="plain">Tümünü seç</button><button id="clearAll" class="plain">Temizle</button></div><div class="bar"><b id="selectedCount">0 ürün seçildi</b><button id="applyButton" class="main">Seçililere uygula</button><button id="logoutButton" class="plain">Çıkış</button></div><div id="productList" class="list"></div><div id="note" class="note"></div></section></main><script>const SUPA='https://lpxexvjfxvxsdikkfctn.supabase.co';const KEY='sb_publishable_wONifG2qgvZs7oAWpR0iZQ_q3CADUj7';let TOKEN='';let ITEMS=[];let SELECTED=new Set();function el(s){return document.querySelector(s)}function safe(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(v){return '₺ '+Number(v||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})}function message(t){el('#note').textContent=t}function draw(){let term=el('#search').value.toLocaleLowerCase('tr-TR');let html='';ITEMS.filter(function(x){return (x.name+' '+x.stock_code).toLocaleLowerCase('tr-TR').includes(term)}).forEach(function(x){let img=x.image_url||(x.flags&&x.flags.images&&x.flags.images[0])||'stok-urunleri.png';html+='<label class="item"><input type="checkbox" data-code="'+safe(x.stock_code)+'" '+(SELECTED.has(x.stock_code)?'checked':'')+'><img src="'+safe(img)+'" alt=""><span><b>'+safe(x.name)+'</b><small>'+safe(x.stock_code)+' · '+safe(x.category||'Diğer')+'</small></span><span class="price">'+money(x.unit_price)+'</span></label>'});el('#productList').innerHTML=html||'<p style="padding:12px">Ürün bulunamadı.</p>';el('#selectedCount').textContent=SELECTED.size+' ürün seçildi'}async function loadProducts(){message('Ürünler yükleniyor...');let r=await fetch(SUPA+'/rest/v1/products?select=stock_code,name,unit_price,category,image_url,flags&active=eq.true&order=name.asc',{headers:{apikey:KEY,Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error('Ürünler yüklenemedi.');ITEMS=await r.json();draw();message('')}async function login(){let b=el('#loginButton');b.disabled=true;el('#loginNote').textContent='Giriş yapılıyor...';try{let r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:el('#email').value.trim(),password:el('#password').value})});let d=await r.json();if(!r.ok)throw new Error(d.error_description||'Giriş yapılamadı.');TOKEN=d.access_token;el('#login').classList.add('hide');el('#work').classList.remove('hide');await loadProducts()}catch(e){el('#loginNote').className='note bad';el('#loginNote').textContent=e.message}b.disabled=false}async function applyDiscount(){let rate=Math.max(0,Math.min(100,Number(el('#rate').value)||0));let targets=ITEMS.filter(function(x){return SELECTED.has(x.stock_code)});if(!targets.length){message('Önce ürün seçin.');return}if(!confirm(targets.length+' ürüne %'+rate+' iskonto uygulansın mı?'))return;let b=el('#applyButton');b.disabled=true;try{for(let i=0;i<targets.length;i++){let x=targets[i];let flags=Object.assign({},x.flags||{}, {discount:rate>0,discountRate:rate});let r=await fetch(SUPA+'/rest/v1/products?stock_code=eq.'+encodeURIComponent(x.stock_code),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({flags:flags})});if(!r.ok)throw new Error(x.name+' güncellenemedi.');x.flags=flags;message((i+1)+' / '+targets.length+' ürün güncellendi...')}message('Tamamlandı. Müşteri sayfasını yenileyince indirimler görünür.')}catch(e){message('İşlem durdu: '+e.message)}b.disabled=false}el('#loginButton').onclick=login;el('#search').oninput=draw;el('#productList').onchange=function(e){let c=e.target.closest('[data-code]');if(!c)return;if(c.checked)SELECTED.add(c.dataset.code);else SELECTED.delete(c.dataset.code);draw()};el('#selectAll').onclick=function(){ITEMS.forEach(function(x){SELECTED.add(x.stock_code)});draw()};el('#clearAll').onclick=function(){SELECTED.clear();draw()};el('#applyButton').onclick=applyDiscount;el('#logoutButton').onclick=function(){location.reload()}</script></body></html>
