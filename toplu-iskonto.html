<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Woodart | Toplu iskonto</title><style>:root{--f:#173b2a;--c:#f7f4ee;--l:#dce4dd;--r:#b34b40}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#26342c;font:15px Arial,sans-serif}.top{background:var(--f);color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.top a{color:white;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:24px 18px 50px}.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;box-shadow:0 6px 18px #173b2a0c}.login{max-width:420px;margin:45px auto}.field{display:grid;gap:6px;margin:12px 0}.field input{padding:11px;border:1px solid var(--l);border-radius:8px;font:inherit}button{font:inherit;cursor:pointer}.primary{background:var(--f);color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:bold}.soft{background:#fff;border:1px solid var(--l);color:var(--f);padding:9px 12px;border-radius:8px;font-weight:bold}.tools{display:grid;grid-template-columns:1fr 130px auto auto;gap:9px;align-items:end;margin:15px 0}.tools input{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px}.summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;color:#617067}.list{max-height:58vh;overflow:auto;border:1px solid var(--l);border-radius:10px}.row{display:grid;grid-template-columns:24px 55px 1fr auto;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.row img{width:55px;height:48px;object-fit:cover;border-radius:7px;background:#eee}.row b,.row small{display:block}.row small{color:#718077;margin-top:3px}.price{font-weight:bold;color:var(--f);white-space:nowrap}.notice{margin-top:12px;min-height:20px;font-weight:bold}.error{color:var(--r)}.hidden{display:none}@media(max-width:650px){.tools{grid-template-columns:1fr 110px}.tools button{width:100%}.row{grid-template-columns:24px 48px 1fr}.price{grid-column:3}.top{font-size:14px}}</style></head><body><header class="top"><b>WOODART · Toplu iskonto</b><a href="yonetim.html">← Yönetim paneli</a></header><main class="wrap"><section id="login" class="panel login"><h2>Yönetici girişi</h2><p>Toplu iskonto uygulamak için giriş yapın.</p><div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Parola</label><input id="password" type="password" autocomplete="current-password"></div><button id="login-btn" class="primary">Giriş yap</button><div id="login-notice" class="notice"></div></section><section id="app" class="hidden"><div class="panel"><h1 style="margin:0">Seçili ürünlere toplu iskonto</h1><p style="color:#617067">İşaretlediğiniz ürünlerin fiyatına aynı yüzde oranı uygulanır. <b>0</b> girerseniz iskonto kaldırılır.</p><div class="tools"><input id="search" placeholder="Ürün adı veya stok kodu ara..."><input id="rate" type="number" min="0" max="100" step="1" value="0" aria-label="İskonto oranı"><button id="all" class="soft">Tümünü seç</button><button id="clear" class="soft">Temizle</button></div><div class="summary"><b id="count">0 ürün seçildi</b><button id="apply" class="primary">Seçililere uygula</button><button id="logout" class="soft">Çıkış</button></div><div id="list" class="list"></div><div id="notice" class="notice"></div></div></section></main><script>(()=>{const url='https://lpxexvjfxvxsdikkfctn.supabase.co',key='sb_publishable_wONifG2qgvZs7oAWpR0iZQ_q3CADUj7';let token='',rows=[],selected=new Set();const q=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₺ '+Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});const say=m=>q('#notice').textContent=m;const draw=()=>{const find=q('#search').value.toLocaleLowerCase('tr-TR');q('#list').innerHTML=rows.filter(x=>(x.name+' '+x.stock_code).toLocaleLowerCase('tr-TR').includes(find)).map(x=>'<label class="row"><input type="checkbox" data-code="'+esc(x.stock_code)+'" '+(selected.has(x.stock_code)?'checked':'')+'><img src="'+esc(x.image_url||x.flags?.images?.[0]||'stok-urunleri.png')+'" alt=""><span><b>'+esc(x.name)+'</b><small>'+esc(x.stock_code)+' · '+esc(x.category||'Diğer')+'</small></span><span class="price">'+money(x.unit_price)+'</span></label>').join('')||'<p style="padding:12px">Ürün bulunamadı.</p>';q('#count').textContent=selected.size+' ürün seçildi'};const load=async()=>{say('Ürünler yükleniyor...');const r=await fetch(url+'/rest/v1/products?select=stock_code,name,unit_price,category,image_url,flags&active=eq.true&order=name.asc',{headers:{apikey:key,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Ürünler yüklenemedi.');rows=await r.json();draw();say('')};const show=()=>{q('#login').classList.add('hidden');q('#app').classList.remove('hidden');load().catch(e=>say(e.message))};q('#login-btn').onclick=async()=>{const b=q('#login-btn');b.disabled=true;q('#login-notice').textContent='Giriş yapılıyor...';try{const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:q('#email').value.trim(),password:q('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||'Giriş yapılamadı.');token=d.access_token;show()}catch(e){q('#login-notice').className='notice error';q('#login-notice').textContent=e.message}finally{b.disabled=false}};q('#search').oninput=draw;q('#list').onchange=e=>{const c=e.target.closest('[data-code]');if(!c)return;c.checked?selected.add(c.dataset.code):selected.delete(c.dataset.code);draw()};q('#all').onclick=()=>{rows.forEach(x=>selected.add(x.stock_code));draw()};q('#clear').onclick=()=>{selected.clear();draw()};q('#logout').onclick=()=>location.reload();q('#apply').onclick=async()=>{const rate=Math.max(0,Math.min(100,Number(q('#rate').value)||0)),targets=rows.filter(x=>selected.has(x.stock_code));if(!targets.length){say('Önce en az bir ürün seçin.');return}if(!confirm(targets.length+' ürüne %'+rate+' iskonto uygulansın mı?'))return;const b=q('#apply');b.disabled=true;let done=0;say('Uygulanıyor...');try{for(const x of targets){const flags={...(x.flags||{}),discount:rate>0,discountRate:rate};const r=await fetch(url+'/rest/v1/products?stock_code=eq.'+encodeURIComponent(x.stock_code),{method:'PATCH',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({flags})});if(!r.ok)throw Error(x.name+' güncellenemedi.');x.flags=flags;done++;say(done+'/'+targets.length+' ürün güncellendi...')}say('Tamamlandı: '+done+' ürün için iskonto kaydedildi. Müşteri sayfasında yenileyince görünür.')}catch(e){say('İşlem durdu: '+e.message)}finally{b.disabled=false}})}();</script></body></html>
